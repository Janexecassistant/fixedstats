<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rental Flow | Dyer Auto Group</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>
:root{--ink:#eaf0f6;--muted:#9ba8b8;--panel:#101d2d;--deep:#071322;--line:#24364b;--blue:#54a8ff;--red:#ff6666;--amber:#ffc34d;--green:#51d39a}*{box-sizing:border-box}body{margin:0;color:var(--ink);background:linear-gradient(135deg,#071322,#0a1828 52%,#0c2132);font:15px/1.4 Inter,system-ui,sans-serif;min-height:100vh}button,input,select,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}.app{max-width:1500px;margin:auto;padding:22px}header,.tools{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.brand{display:flex;gap:12px;align-items:center}.mark{width:38px;height:38px;display:grid;place-items:center;background:#fff;border-radius:9px;color:#0b3154;font-weight:900;font-size:20px}.eyebrow{color:var(--blue);font-weight:800;font-size:11px;letter-spacing:.12em;text-transform:uppercase}.brand h1{font-size:23px;margin:0;line-height:1.1}.sub{color:var(--muted);font-size:12px}.btn{display:inline-block;color:#fff;text-decoration:none;border:1px solid #38516b;background:#172b40;border-radius:8px;padding:10px 13px;font-weight:750}.btn.primary{background:var(--blue);border-color:var(--blue);color:#051523}.btn.small{padding:6px 9px;font-size:12px}.summary,.board{display:grid;gap:12px;margin-top:18px}.summary{grid-template-columns:repeat(4,1fr)}.stat,.lane{background:rgba(16,29,45,.9);border:1px solid var(--line);border-radius:10px}.stat{padding:14px 16px}.stat b{font-size:28px;display:block}.stat span{color:var(--muted);font-weight:650;font-size:12px;text-transform:uppercase;letter-spacing:.06em}.board{grid-template-columns:repeat(4,minmax(220px,1fr));align-items:start}.lane{min-height:330px;overflow:hidden}.lane-head{display:flex;justify-content:space-between;padding:12px 14px;border-bottom:1px solid var(--line);font-weight:850}.lane-head small{padding:3px 8px;background:#1c3249;border-radius:99px}.cards{padding:8px;display:grid;gap:8px}.card{background:#13243a;border:1px solid #29425d;border-radius:9px;padding:11px}.card h3{margin:0 0 4px;font-size:16px}.card p{color:#cbd9e8;margin:3px 0}.card small{color:var(--muted);display:block}.badge{font-size:10px;font-weight:850;letter-spacing:.04em;text-transform:uppercase;border-radius:99px;padding:3px 7px;background:#264158;color:#c8e2fb}.badge.red{background:#542733;color:#ffcad1}.badge.amber{background:#58451d;color:#ffe29a}.badge.green{background:#174a3a;color:#a5f3cf}.actions{display:flex;gap:7px;margin-top:10px;flex-wrap:wrap}.empty{color:#72849a;text-align:center;padding:24px 8px;font-size:13px}.modal{position:fixed;inset:0;background:#01080fc9;z-index:10;display:flex;align-items:center;justify-content:center;padding:16px}.modal-card{width:min(720px,100%);max-height:94vh;overflow:auto;background:#102136;border:1px solid #38516b;border-radius:13px;padding:20px}.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.field{display:grid;gap:5px}.field label{font-size:12px;color:#adbed0;font-weight:750}.full{grid-column:1/-1}input,select,textarea{color:var(--ink);background:#0a1624;border:1px solid #38516b;border-radius:7px;padding:9px}textarea{min-height:76px;resize:vertical}.toast{position:fixed;right:18px;bottom:18px;padding:12px 15px;border-radius:8px;background:#153657;border:1px solid #4b86b9;color:#e7f4ff;z-index:30}.toast.error{background:#4b202b;border-color:#af5262}@media(max-width:900px){.summary{grid-template-columns:repeat(2,1fr)}.board{grid-template-columns:repeat(2,1fr)}}@media(max-width:560px){.app{padding:14px}.board,.form{grid-template-columns:1fr}.full{grid-column:auto}}
</style></head><body><main id="app" class="app hidden"><header><div class="brand"><div class="mark">D</div><div><div class="eyebrow">Fixed Operations</div><h1>Rental Flow</h1><div id="updated" class="sub">Loading rental activity…</div></div></div><div class="tools"><a class="btn" href="service-board.html">← Dispatch Flow</a><button id="addBtn" class="btn primary">+ Add rental</button></div></header><section class="summary"><div class="stat"><b id="active">0</b><span>Active rentals</span></div><div class="stat"><b id="requested">0</b><span>Need a unit</span></div><div class="stat"><b id="due">0</b><span>Due today / overdue</span></div><div class="stat"><b id="out">0</b><span>Out with customer</span></div></section><section id="board" class="board"></section></main><div id="login" class="app hidden"><h1>Rental Flow</h1><p>Open this from Fixedstats after signing in.</p><a class="btn primary" href="index.html">Open Fixedstats</a></div><div id="modal" class="modal hidden"><div class="modal-card"><div class="tools"><div><div class="eyebrow">Rental handoff</div><h2 id="formTitle" style="margin:2px 0">Add rental</h2></div><button id="closeBtn" class="btn">Cancel</button></div><form id="form" class="form"><input id="id" type="hidden"><div class="field"><label>RO number</label><input id="roNumber"></div><div class="field"><label>Customer</label><input id="customer" required></div><div class="field"><label>Customer vehicle</label><input id="vehicle"></div><div class="field"><label>Rental / loaner unit</label><input id="unit" placeholder="Unit number or VIN"></div><div class="field"><label>Provider</label><select id="provider"><option value="">Select when assigned</option><option>Dealer loaner</option><option>DRAC</option><option>Enterprise</option><option>Hertz</option><option>Other</option></select></div><div class="field"><label>Status</label><select id="status"><option value="requested">Requested — needs a unit</option><option value="reserved">Reserved</option><option value="out">Out with customer</option><option value="return_due">Return due</option><option value="returned">Returned</option></select></div><div class="field"><label>Return due date</label><input id="dueDate" type="date"></div><div class="field"><label>Advisor</label><input id="advisor"></div><div class="field full"><label>Rental notes</label><textarea id="notes" placeholder="Insurance approval, extension needed, fuel, damage…"></textarea></div><div class="full tools" style="justify-content:flex-end"><button class="btn primary">Save rental</button></div></form></div></div><div id="toast" class="toast hidden"></div><script>
const SUPABASE_URL='https://eflnjrorpgrqbvzljewu.supabase.co',KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVmbG5qcm9ycGdycWJ2emxqZXd1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU1Njg5ODMsImV4cCI6MjA5MTE0NDk4M30.4qVg6A4kynixs-Dm-Et1geJ56jqymekdnI0LexbIr_g';
const db=window.supabase.createClient(SUPABASE_URL,KEY),$=id=>document.getElementById(id),STORES={dcvb:'Dyer Chevrolet Vero Beach',dcfp:'Dyer Chevrolet Fort Pierce',dclw:'Dyer Chevrolet Lake Wales',subaru:'Dyer Subaru',mazda:'Dyer Mazda'};let user=null,cars=[];const demo=new URLSearchParams(location.search).has('demo');function toast(m,e=false){$('toast').textContent=m;$('toast').className='toast '+(e?'error':'');setTimeout(()=>$('toast').classList.add('hidden'),4000)}function today(){return new Date().toISOString().slice(0,10)}function statusLabel(s){return({requested:'Needs unit',reserved:'Reserved',out:'Out with customer',return_due:'Return due',returned:'Returned'})[s]||s}function tone(s){return s==='returned'?'green':s==='requested'||s==='return_due'?'red':s==='reserved'?'amber':''}function lane(status,rows){return `<section class="lane"><div class="lane-head"><span>${statusLabel(status)}</span><small>${rows.length}</small></div><div class="cards">${rows.length?rows.map(r=>`<article class="card"><h3>${r.rental_unit||'Unit not assigned'}</h3><span class="badge ${tone(r.status)}">${statusLabel(r.status)}</span><p>${r.customer_name}</p><small>RO ${r.ro_number||'—'} · ${r.customer_vehicle||'Vehicle not entered'}</small><small>${r.rental_provider||'Provider not assigned'}${r.due_date?' · Due '+r.due_date:''}</small><div class="actions"><button class="btn small" onclick="edit('${r.id}')">Edit</button>${r.status!=='returned'?`<button class="btn small" onclick="setStatus('${r.id}','returned')">Mark returned</button>`:''}</div></article>`).join(''):'<div class="empty">Nothing here right now.</div>'}</div></section>`}function render(){const active=cars.filter(c=>c.status!=='returned'),requested=cars.filter(c=>c.status==='requested'),due=cars.filter(c=>c.status!=='returned'&&c.due_date&&c.due_date<=today()),out=cars.filter(c=>c.status==='out');$('active').textContent=active.length;$('requested').textContent=requested.length;$('due').textContent=due.length;$('out').textContent=out.length;$('board').innerHTML=['requested','reserved','out','return_due'].map(s=>lane(s,cars.filter(c=>c.status===s))).join('')}async function load(){if(demo){render();return}try{const {data,error}=await db.from('rental_flow_cars').select('*').eq('store_id',user.default_store||'dcvb').neq('status','returned').order('due_date');if(error)throw error;cars=data||[];$('updated').textContent='Live rental flow · refreshed '+new Date().toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});render()}catch(e){toast('Rental Flow needs the Dispatch Flow SQL migration.',true);render()}}function open(car=null){$('modal').classList.remove('hidden');$('form').reset();$('id').value='';$('formTitle').textContent=car?'Edit rental':'Add rental';if(car){$('id').value=car.id;[['roNumber','ro_number'],['customer','customer_name'],['vehicle','customer_vehicle'],['unit','rental_unit'],['provider','rental_provider'],['status','status'],['dueDate','due_date'],['advisor','advisor_name'],['notes','notes']].forEach(([el,key])=>$(el).value=car[key]||'')}else{const raw=sessionStorage.getItem('dyer_rental_flow_draft');if(raw){const d=JSON.parse(raw);$('roNumber').value=d.ro_number||'';$('customer').value=d.customer_name||'';$('vehicle').value=d.vehicle||'';$('advisor').value=d.advisor_name||'';$('dueDate').value=d.rental_due_date||'';$('notes').value=d.notes||'';sessionStorage.removeItem('dyer_rental_flow_draft')}}}async function save(e){e.preventDefault();const id=$('id').value||crypto.randomUUID(),row={id,store_id:user.default_store||'dcvb',ro_number:$('roNumber').value.trim(),customer_name:$('customer').value.trim(),customer_vehicle:$('vehicle').value.trim(),rental_unit:$('unit').value.trim(),rental_provider:$('provider').value,status:$('status').value,due_date:$('dueDate').value||null,advisor_name:$('advisor').value.trim(),notes:$('notes').value.trim(),updated_by:user.id,updated_at:new Date().toISOString(),returned_at:$('status').value==='returned'?new Date().toISOString():null};if(demo){cars=cars.filter(c=>c.id!==id);cars.push(row);$('modal').classList.add('hidden');render();return}const {error}=await db.from('rental_flow_cars').upsert(row);if(error){toast(error.message,true);return}$('modal').classList.add('hidden');await load()}async function setStatus(id,status){const c=cars.find(c=>c.id===id);if(!c)return;c.status=status;c.returned_at=status==='returned'?new Date().toISOString():null;if(demo){render();return}const {error}=await db.from('rental_flow_cars').update({status,returned_at:c.returned_at,updated_at:new Date().toISOString()}).eq('id',id);if(error)toast(error.message,true);await load()}window.edit=id=>open(cars.find(c=>c.id===id));window.setStatus=setStatus;$('addBtn').onclick=()=>open();$('closeBtn').onclick=()=>$('modal').classList.add('hidden');$('form').onsubmit=save;(async()=>{if(demo){user={id:null,default_store:'dcvb'};$('app').classList.remove('hidden');const raw=sessionStorage.getItem('dyer_rental_flow_draft');if(raw)open();render();return}try{user=JSON.parse(sessionStorage.getItem('dyer_session')||localStorage.getItem('dyer_session'));if(!user)throw 0;const {data}=await db.rpc('validate_session',{p_token:user.token});if(!data)throw 0;$('app').classList.remove('hidden');await load();if(sessionStorage.getItem('dyer_rental_flow_draft'))open()}catch(e){$('login').classList.remove('hidden')}})();
</script><script>(()=>{document.title='Rental Board | Dyer Auto Group';document.querySelectorAll('h1').forEach(title=>title.textContent='Rental Board');const tools=document.querySelector('header .tools');if(!tools)return;const dispatch=tools.querySelector('a[href="service-board.html"]');if(dispatch)dispatch.textContent='Dispatch Board';const rental=document.createElement('a');rental.className='btn primary';rental.href='rental-flow.html';rental.textContent='Rental Board';tools.prepend(rental);const home=document.createElement('a');home.className='btn';home.href='index.html';home.textContent='← FixedStats';tools.append(home)})();</script>
<script>
load=async function(){if(demo){render();return}try{const {data,error}=await db.rpc('rental_flow_list',{p_token:user.token,p_store_id:user.default_store||'dcvb'});if(error)throw error;cars=data||[];$('updated').textContent='Live rental flow · refreshed '+new Date().toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});render()}catch(e){toast('Could not reach the shared Rental Board: '+(e.message||'unknown error'),true);render()}};
